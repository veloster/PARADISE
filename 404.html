*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--marine);color:var(--blanc);font-family:var(--font);font-size:17px;line-height:1.5}

main{flex:1;display:flex;align-items:center;padding-block:48px}
.wrap{width:100%;max-width:760px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));text-align:center}

.eyebrow{display:block;font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--jaune)}
h1{font-size:clamp(44px,9vw,84px);line-height:.95;font-weight:800;letter-spacing:-.03em;margin:12px 0 16px;text-wrap:balance}
p{margin:0 auto;max-width:42ch;font-size:19px}
.ctas{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:32px}
.btn{display:inline-flex;align-items:center;gap:8px;font-weight:500;font-size:15px;text-decoration:none;border-radius:999px;padding:12px 20px;min-height:44px;border:1.5px solid transparent;transition:background-color .3s ease,border-color .3s ease}
.btn--sun{background:var(--jaune);color:var(--marine);font-weight:800}
.btn--sun:hover{background:#FFD23F}
.btn--ghost{border-color:rgba(255,255,255,.55);color:var(--blanc)}
.btn--ghost:hover{border-color:var(--blanc);background:rgba(255,255,255,.08)}
footer{background:var(--marine-deep);color:#D9F4FA;padding-block:24px;font-size:14px}
