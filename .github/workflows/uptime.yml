name: Uptime paradicelv.com
# Checks the live site every 15 minutes. A failed run = GitHub e-mails the repo owner.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Home page answers 200 with the site content
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o page.html -w '%{http_code}' --max-time 20 "https://paradicelv.com/?uptime=$(date +%s)") || code=000
            if [ "$code" = "200" ] && grep -q "Floop LLC" page.html; then echo "OK ($code)"; exit 0; fi
            echo "Attempt $i failed: HTTP $code"; sleep 20
          done
          echo "::error::paradicelv.com is down or not serving the site"; exit 1
      - name: Key pages and redirects
        run: |
          set -e
          for p in privacy.html terms.html birthday-club-rules.html assets/js/site.js?v=3; do
            c=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "https://paradicelv.com/$p"); echo "$p $c"; [ "$c" = "200" ]
          done
          r=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' --max-time 20 http://paradicelv.com/); echo "http -> $r"
          case "$r" in 301*https://paradicelv.com/*) ;; *) echo "::error::HTTP is not redirected to HTTPS"; exit 1;; esac
      - name: Certificates expire in more than 14 days (Cloudflare edge + GitHub origin)
        run: |
          check() {
            end=$(echo | openssl s_client -connect "$1:443" -servername paradicelv.com 2>/dev/null | openssl x509 -noout -enddate | cut -d= -f2)
            [ -n "$end" ] || { echo "::error::No certificate from $2"; return 1; }
            left=$(( ( $(date -d "$end" +%s) - $(date +%s) ) / 86400 ))
            echo "$2 certificate valid until $end ($left days)"
            [ "$left" -gt 14 ] || { echo "::error::$2 certificate expires in $left days"; return 1; }
          }
          check paradicelv.com "Cloudflare edge"
          # Origin = GitHub Pages. Behind the Cloudflare proxy its renewal is not guaranteed:
          # if this fails, set @ and www to DNS only in Cloudflare so GitHub can renew (plan R2).
          check 185.199.108.153 "GitHub origin"
      - name: Security headers are served
        run: |
          h=$(curl -sI --max-time 20 https://paradicelv.com/)
          for x in strict-transport-security x-frame-options x-content-type-options content-security-policy; do
            echo "$h" | grep -qi "^$x:" && echo "$x OK" || { echo "::error::Missing header $x"; exit 1; }
          done
